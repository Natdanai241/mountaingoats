<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0518">
<title>แพะภูเขา — Mountain Goats</title>
<style>
:root{--f:"Noto Sans Thai","IBM Plex Sans Thai","Sarabun","Leelawadee UI","Leelawadee","Thonburi","Tahoma",system-ui,-apple-system,"Segoe UI",sans-serif;
--ink:#152230;--mut:#5b6976;--pap:#fbf8f2;--pap2:#efe6d6;--ln:rgba(21,34,48,.13);--foc:#2f7cf6;
--m5:#4f9a3f;--m6:#1f8a7a;--m7:#2f6fb0;--m8:#6a52b8;--m9:#b8457a;--m10:#c9741a;--g0:#f06a35;--g1:#2f7cf6;--g2:#2f9a5c;--g3:#9a5bdc;

--die:clamp(44px,6.2vh,58px);--gs:clamp(14px,min(3.1vh,3.3vw),30px)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f);color:var(--ink);line-height:1.45;-webkit-tap-highlight-color:transparent;background:linear-gradient(180deg,#0d1830 0%,#23396a 28%,#7a5b8c 52%,#e08a68 74%,#f6c98f 90%,#f9dcaa 100%)}
body.rm *,body.rm *::before,body.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--foc);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}.bg svg{position:absolute;left:0;bottom:0;width:100%;height:72%}
#app{position:relative;z-index:1;height:100vh;height:100dvh;max-width:1480px;margin:0 auto;display:flex;flex-direction:column;
padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.ic{width:20px;height:20px;flex:none}
.goat{display:block;overflow:visible}
.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:12px;padding:.5em 1em;min-height:42px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;
box-shadow:0 2px 0 rgba(0,0,0,.12),inset 0 0 0 1px var(--ln);transition:transform .12s,filter .15s,opacity .15s;touch-action:manipulation}
.btn:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.05)}.btn:not(:disabled):active{transform:translateY(1px)}.btn:disabled{opacity:.45;cursor:not-allowed}
.pri{background:linear-gradient(180deg,#ff8f57,#e2541f);color:#fff;box-shadow:0 4px 0 #a83c14,0 8px 18px rgba(226,84,31,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.grn{background:linear-gradient(180deg,#43a06f,#26603f);color:#fff;box-shadow:0 4px 0 #18402a,inset 0 1px 0 rgba(255,255,255,.3)}
.soft{background:var(--pap2)}.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.42)}
.dng{background:#fff;color:#b3352d;box-shadow:inset 0 0 0 2px #d0463d}
.sm{min-height:34px;padding:.3em .75em;font-size:.86rem;border-radius:10px}.wide{width:100%}.big{font-size:1.12rem;min-height:50px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.c{justify-content:center}
.mut{color:var(--mut);font-size:.9em}.err{color:#b3352d;font-weight:600;margin:.3em 0}
.ib{width:38px;height:38px;flex:none;border-radius:11px;border:0;cursor:pointer;display:inline-grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.26)}
.ib:hover{background:rgba(255,255,255,.24)}
/* menu */
.menu{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;gap:clamp(4px,1.3vh,14px)}
.hero-art{height:clamp(70px,22vh,210px);width:auto;max-width:92vw;filter:drop-shadow(0 14px 24px rgba(0,0,0,.4))}
.title{font-size:clamp(42px,min(12vw,10vh),104px);font-weight:900;line-height:1.2;margin:0;padding-top:.06em;background:linear-gradient(180deg,#fffaf0,#ffd890 55%,#f2894a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(70,28,10,.45)) drop-shadow(0 12px 20px rgba(0,0,0,.3))}
.sub{letter-spacing:.5em;font-weight:800;margin:0;opacity:.9;font-size:clamp(11px,1.6vh,15px)}
.tag{margin:0;max-width:560px;font-size:clamp(.9rem,2vh,1.08rem);opacity:.95}
.play{font-size:clamp(1.1rem,2.6vh,1.35rem);padding:.6em 2.4em;border-radius:999px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(940px,100%);margin-top:4px}
.mode{display:flex;align-items:center;gap:12px;text-align:left;border:0;cursor:pointer;background:var(--glass);color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);transition:transform .15s}

.mi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}.mi .ic{width:24px;height:24px}
.stats{margin:0;font-size:.85rem;opacity:.9}
@media (max-width:720px){.modes{grid-template-columns:1fr;gap:7px}.mode{padding:8px 12px}.mi{width:38px;height:38px}}
@media (max-height:700px){.hero-art{display:none}}@media (max-height:560px){.tag,.stats,.sub{display:none}}
/* setup */
.setup{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;width:min(660px,100%);margin:0 auto}
.head{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:10px}.head h1{margin:0;font-size:1.4rem}
.card{min-height:0;overflow:auto;background:var(--glass);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.fld{display:block;margin:0 0 12px}.fld>span{display:block;font-weight:700;margin-bottom:5px;font-size:.92rem}
.inp,.code{width:100%;min-height:42px;border-radius:12px;border:2px solid var(--ln);background:#fff;padding:.45em .8em}
.inp:focus,.code:focus{border-color:var(--foc);outline:none}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all;resize:vertical}
.chip{border:2px solid var(--ln);background:#fff;border-radius:999px;min-height:38px;padding:4px 13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#1f4a35;color:#fff;border-color:#1f4a35}
.sw{width:15px;height:15px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2);flex:none}
.names{display:grid;grid-template-columns:1fr 1fr;gap:7px}.names .row{flex-wrap:nowrap}
@media (max-width:520px){.names{grid-template-columns:1fr}}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 0;border-bottom:1px solid var(--ln);cursor:pointer;text-align:left}
.tog i{width:46px;height:27px;border-radius:999px;background:#c9c3b6;position:relative;flex:none}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on i{background:#2f6b4c}.tog.on i::after{transform:translateX(19px)}
.note{background:#fff6e5;border-left:4px solid #c27a12;padding:9px 12px;border-radius:10px;font-size:.88rem;margin:0 0 12px}.note.info{background:#eaf3ff;border-color:var(--foc)}
.tabs{display:flex;gap:6px;background:var(--pap2);padding:4px;border-radius:14px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;border-radius:10px;min-height:40px;font-weight:700;cursor:pointer}.tabs button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seat{border:1px solid var(--ln);border-radius:14px;padding:10px;margin-bottom:10px;background:#fff}
.sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.sn{flex:1;min-width:0;overflow-wrap:anywhere}.step{display:grid;gap:6px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;background:#eceff1;color:#5b6770}
.pill.waiting{background:#fff2d6;color:#8a5a00}.pill.connecting{background:#e3efff;color:#1452b8}.pill.connected{background:#dff3e6;color:#1e6b3e}
.pill.disconnected{background:#ffe9d6;color:#9a4a00}.pill.failed{background:#fde2e0;color:#a82a22}.pill.bot{background:#ece6fb;color:#5a3fb0}
.adv{margin-top:12px;font-size:.85rem}.adv summary{cursor:pointer;font-weight:700}.adv pre{white-space:pre-wrap;word-break:break-all;background:#1e2a33;color:#cfe3ef;padding:8px;border-radius:10px;font-size:11px}
.room{font-family:ui-monospace,Menlo,monospace;font-weight:800;letter-spacing:.15em;background:#fff;border-radius:8px;padding:2px 8px}
/* game layout */
.game{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:minmax(0,1fr) 352px;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top" "players tray" "board tray"}
@media (max-width:820px){.game{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"top" "players" "board" "tray"}}
.top{grid-area:top;height:52px;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(20,34,60,.86),rgba(10,18,32,.8));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;border-radius:16px;padding:6px 6px 6px 8px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.12);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.1rem;flex:none}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,#ffd08a,#e2783a);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.4),0 3px 8px rgba(0,0,0,.3)}.logo .goat{width:30px;height:28px}
.turn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden}
.tp{display:inline-flex;align-items:center;gap:5px;min-width:0;background:#fff;color:var(--ink);border-radius:999px;padding:2px 12px 2px 4px;font-weight:800;box-shadow:inset 0 0 0 2px var(--pc,#fff)}
.tp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tp .goat{width:26px;height:24px;flex:none}
.rd{background:rgba(255,255,255,.14);border-radius:999px;padding:2px 10px}
.last{background:#ffd890;color:#5a2e00;border-radius:999px;padding:2px 10px;font-weight:800;font-size:.78rem;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.6}}
.tools{display:flex;gap:5px;flex:none}
@media (max-width:600px){.brand b,.rd{display:none}.ib{width:35px;height:35px}.logo{width:34px;height:34px}}
/* players strip (the only scrollable strip) */
.players{grid-area:players;position:relative;height:86px;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding:12px 2px 6px;min-width:0;scrollbar-width:thin}
.pc{flex:1 0 214px;max-width:320px;height:66px;scroll-snap-align:start;position:relative;display:flex;align-items:center;gap:9px;border-radius:16px;padding:0 10px 0 13px;
background:linear-gradient(180deg,#fffdf9,#f1ead9);box-shadow:0 6px 16px rgba(4,10,22,.25),inset 0 1px 0 #fff;border:2px solid transparent}
.pc::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:5px;border-radius:0 4px 4px 0;background:var(--pc)}
.pc.act{border-color:var(--pc);box-shadow:0 0 0 3px rgba(255,255,255,.55),0 0 18px var(--pc),0 10px 22px rgba(4,10,22,.35)}
.pav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 50% 28%,#ffffff,#d9e5f1 72%);box-shadow:inset 0 0 0 2.5px var(--pc),0 2px 6px rgba(0,0,0,.18)}.pav .goat{width:34px;height:31px}
.pinfo{flex:1;min-width:0}.pname{display:flex;align-items:center;gap:5px;min-width:0}.pname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{font-size:.64rem;font-weight:700;background:var(--pap2);color:var(--mut);border-radius:999px;padding:0 7px;white-space:nowrap}
.ptk{display:flex;flex-wrap:nowrap;gap:3px;margin-top:4px;overflow:hidden}
.tk{min-width:19px;height:18px;border-radius:6px;background:var(--cc);color:#fff;font-size:.68rem;font-weight:900;display:inline-grid;place-items:center;padding:0 4px;text-shadow:0 1px 0 rgba(0,0,0,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);flex:none}.tk.z{opacity:.22}
.bc{height:18px;font-size:.64rem;font-weight:900;color:#5a3500;background:linear-gradient(160deg,#fff0b8,#e7a93a);border-radius:6px;padding:0 5px;display:inline-grid;place-items:center;white-space:nowrap;flex:none}
.psc{text-align:right;flex:none;line-height:1}.psc b{font-size:1.5rem;font-weight:900;display:block}.psc small{font-size:.64rem;color:var(--mut)}
.pturn{position:absolute;top:-10px;right:10px;background:var(--pc);color:#fff;font-size:.66rem;font-weight:800;padding:1px 8px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.nd{width:9px;height:9px;border-radius:50%;background:#c4413a;flex:none}.nd.connected{background:#2f8f57}
@media (max-width:820px){.pc{flex-basis:186px;padding:0 8px 0 11px}.pav{width:36px;height:36px}.pav .goat{width:28px;height:26px}.psc b{font-size:1.25rem}}
/* board */
.board{grid-area:board;position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;border-radius:var(--r);padding:8px 10px;overflow:hidden;
box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.5);background:linear-gradient(180deg,#6aa2dc 0%,#a8cdef 38%,#ecdcb9 76%,#8db26f 100%)}
.sky{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bhead{position:relative;z-index:2;flex:none;height:32px;display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow:hidden;font-weight:800;font-size:.76rem;color:#1d2f3d}
.lbl{background:rgba(255,255,255,.7);border-radius:999px;padding:2px 9px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.1)}.sp{flex:1}
.hx{width:30px;height:27px;flex:none;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);display:inline-grid;place-items:center;font-weight:900;font-size:.74rem;color:#5a3500;background:linear-gradient(160deg,#fff3c2,#e3a136)}
.hx.off{filter:grayscale(1);opacity:.3}
.mts{position:relative;z-index:1;flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(4px,1.1vw,16px);padding-top:24px}
.mt{position:relative;display:grid;grid-template-rows:repeat(5,minmax(0,1fr)) auto;row-gap:clamp(3px,.6vh,7px);min-width:0;min-height:0}
.rock{grid-column:1;position:relative;z-index:0;margin:-20px -16% 0;clip-path:polygon(50% 0,58% 7%,63% 5%,72% 22%,78% 20%,100% 100%,0 100%,20% 30%,27% 26%,37% 6%,43% 9%);
background:linear-gradient(100deg,rgba(255,255,255,.24) 0 44%,rgba(0,0,0,.2) 56% 100%),linear-gradient(180deg,rgba(0,0,0,0) 32%,var(--mc) 210%),linear-gradient(180deg,#c6d0dc,#8d9aab 45%,#5e697a 80%,#454f5d)}
.rock::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff,#e2eaf4);clip-path:polygon(50% 0,58% 7%,63% 5%,68% 14%,64% 19%,59% 14%,55% 21%,50% 15%,45% 22%,41% 15%,36% 19%,33% 13%,37% 6%,43% 9%)}
.rock::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(162deg,rgba(255,255,255,.07) 0 2px,transparent 2px 15px),repeating-linear-gradient(20deg,rgba(0,0,0,.05) 0 2px,transparent 2px 19px)}
.cell{grid-column:1;position:relative;z-index:1;min-height:0;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0 4px;
background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.12));border:1.5px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 5px rgba(20,30,45,.18)}
.cell.sum{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(226,236,248,.7));border:2px solid #fff;box-shadow:0 0 0 2px rgba(255,214,140,.75),0 4px 12px rgba(20,30,45,.28)}
.cell.sum.own{box-shadow:0 0 0 3px var(--own),0 0 24px var(--own),0 4px 12px rgba(0,0,0,.28)}
.cell.foot{background:linear-gradient(180deg,rgba(116,164,90,.92),rgba(58,100,52,.95));border:1.5px solid rgba(255,255,255,.4);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 3px 6px rgba(0,0,0,.2)}
.cell.tg{outline:3px dashed #fff;outline-offset:-3px;background:rgba(47,124,246,.55);animation:pulse 1.1s infinite}
.cell.burst{animation:burst .9s}@keyframes burst{0%{box-shadow:0 0 0 0 rgba(255,216,144,.95)}100%{box-shadow:0 0 0 22px rgba(255,216,144,0)}}
.cell.shake{animation:shake .5s}@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.gw{--g:var(--gs);position:relative;flex:0 1 var(--g);min-width:3px;height:calc(var(--g)*.92)}
.cell.sum .gw{--g:calc(var(--gs)*1.35)}
.gw .goat{position:absolute;left:50%;bottom:0;width:var(--g);height:calc(var(--g)*.92);margin-left:calc(var(--g)/-2);filter:drop-shadow(0 0 1.2px rgba(255,255,255,.95)) drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.goat.hop{animation:hop .55s}@keyframes hop{0%{transform:translateY(10px) scale(.8)}50%{transform:translateY(-8px) scale(1.15)}}
.cnt{position:absolute;right:2px;top:2px;background:rgba(15,25,40,.8);color:#fff;font-size:.6rem;font-weight:800;border-radius:999px;padding:0 5px;line-height:1.5}
.flag{position:absolute;top:-16px;right:3px;width:15px;height:19px;color:var(--own);filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.fl{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-weight:900;color:#fff;font-size:1.15rem;text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 8px rgba(0,0,0,.35);animation:up 1.2s forwards;pointer-events:none;z-index:4}
@keyframes up{0%{opacity:0;transform:translate(-50%,8px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
.mfoot{grid-row:6;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:4px;position:relative;z-index:2}
.mnum{width:clamp(26px,4.4vh,40px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45),transparent 45%),var(--mc);color:#fff;font-weight:900;font-size:clamp(.85rem,2.1vh,1.15rem);display:grid;place-items:center;border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.msup{min-width:48px;justify-content:center;font-size:.7rem;font-weight:800;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.82);border-radius:999px;padding:0 6px 0 2px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mt.dep .mnum{filter:grayscale(.85);opacity:.7}
.pb{position:absolute;top:-18px;left:50%;transform:translateX(-50%);z-index:5;background:var(--foc);color:#fff;border-radius:999px;padding:0 9px;font-weight:900;font-size:.8rem;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.coin{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-weight:900;font-size:.68rem;color:#fff;flex:none;text-shadow:0 1px 0 rgba(0,0,0,.4);border:1.5px solid rgba(0,0,0,.2);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 45%),var(--cc)}
.coin.xs{width:16px;height:16px;font-size:.52rem}
@media (max-width:600px){.mts{gap:3px;padding-top:20px}.rock{margin:-16px -18% 0}.msup{min-width:34px;font-size:.58rem;padding:0 3px 0 1px}.hx{width:24px;height:22px;font-size:.6rem}.cell{border-radius:8px;padding:0 2px}.lbl{padding:2px 6px}}
/* tray: fixed sections so nothing jumps */
.tray{grid-area:tray;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden;padding:12px;border-radius:var(--r);background:linear-gradient(180deg,rgba(253,250,244,.97),rgba(240,232,217,.96));box-shadow:var(--sh),inset 0 1px 0 #fff}

.dw{display:flex;flex-direction:column;align-items:center;gap:5px;width:calc(var(--die) + 4px)}
.die{width:var(--die);height:var(--die);border-radius:22%;padding:12%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);background:linear-gradient(145deg,#fff,#ebe3d3);border:3px solid transparent;
box-shadow:inset 0 -4px 0 rgba(0,0,0,.1),inset 0 2px 0 #fff,0 6px 12px rgba(0,0,0,.4);cursor:pointer;transition:transform .15s,border-color .15s}
.die:disabled{cursor:default}span.die{cursor:default}

.die.blank{display:grid;place-items:center;grid-template-columns:1fr;grid-template-rows:1fr;opacity:.32;font-weight:900;font-size:1.3rem;color:#6d6455}
.die.sel{transform:translateY(-7px);border-color:#ffd25e;box-shadow:0 0 0 3px rgba(255,210,94,.45),0 12px 18px rgba(0,0,0,.45)}
.die.g0{border-color:var(--g0)}.die.g1{border-color:var(--g1)}.die.g2{border-color:var(--g2)}.die.g3{border-color:var(--g3)}
.die.wild{background:linear-gradient(145deg,#fff8e0,#f3da98)}
.die.roll{animation:tumble .6s}@keyframes tumble{30%{transform:rotate(160deg) scale(.82)}60%{transform:rotate(300deg) scale(1.08)}100%{transform:rotate(360deg)}}
.gt{font-size:.66rem;font-weight:800;color:#fff;border-radius:999px;padding:0 7px;height:19px;line-height:19px;white-space:nowrap}.gt.g0{background:var(--g0)}.gt.g1{background:var(--g1)}.gt.g2{background:var(--g2)}.gt.g3{background:var(--g3)}
.wb{border:0;background:#ffe7a8;color:#6a4100;font-weight:800;font-size:.66rem;border-radius:999px;padding:0 7px;cursor:pointer;height:19px}
.work{flex:1 1 0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:8px;background:rgba(22,36,48,.045);box-shadow:inset 0 0 0 1px var(--ln)}
.tip{margin:auto;text-align:center;color:var(--mut);font-size:.84rem;padding:4px}
.wr{background:#fff8e6;border-radius:12px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:.85rem}
.fb{width:34px;height:34px;border-radius:9px;border:2px solid var(--ln);background:#fff;font-weight:900;cursor:pointer}.fb.on{background:#1f4a35;color:#fff;border-color:#1f4a35}.fb:disabled{opacity:.3;cursor:not-allowed}
.groups{display:flex;flex-wrap:wrap;gap:5px}
.gc{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 4px 2px 10px;background:#fff;box-shadow:inset 0 0 0 2px var(--g0);font-weight:700;font-size:.84rem}

.pv{background:#eaf3ff;border-radius:12px;padding:6px 10px;font-size:.84rem;line-height:1.35}
.bn{font-size:.86rem;background:#f1ecfb;border-radius:12px;padding:7px 11px;color:#3b2c6b}
.nb{border-radius:12px;padding:6px 10px;font-size:.84rem;font-weight:600;background:#ffe9d6;color:#7a3a00;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tfoot{flex:none;display:flex;flex-direction:column;gap:6px}
.acts{display:flex;gap:6px;height:48px}.acts .btn{flex:1 1 0;min-width:0;height:48px;padding-left:.4em;padding-right:.4em}.acts .cm{flex:1.7 1 0}

 transform="translate(0 120)" fill="#07030d"><path class="bat" d="M0 0 L-6 -8 Q-14 -11 -25 -2 Q-18 -2 -16 4 Q-10 0 -6 6 L0 3 L6 6 Q10 0 16 4 Q18 -2 25 -2 Q14 -11 6 -8Z"/></g><g transform="translate(0 220) scale(.7)" fill="#07030d"><path class="bat" style="animation-duration:27s;animation-delay:-11s" d="M0 0 L-6 -8 Q-14 -11 -25 -2 Q-18 -2 -16 4 Q-10 0 -6 6 L0 3 L6 6 Q10 0 16 4 Q18 -2 25 -2 Q14 -11 6 -8Z"/></g><g transform="translate(0 70) scale(.5)" fill="#07030d"><path class="bat" style="animation-duration:21s;animation-delay:-4s" d="M0 0 L-6 -8 Q-14 -11 -25 -2 Q-18 -2 -16 4 Q-10 0 -6 6 L0 3 L6 6 Q10 0 16 4 Q18 -2 25 -2 Q14 -11 6 -8Z"/></g></svg></div>

<div id="boot">กำลังโหลดเกม… ถ้าข้อความนี้ไม่หายไป แสดงว่าสคริปต์ไม่ได้ทำงาน (โค้ดอาจคัดลอกมาไม่ครบ)</div>
<script>
(function(){
'use strict';
var BOOT=document.getElementById('boot');
function bootMsg(m,e){BOOT.hidden=false;BOOT.className=e?'e':'';BOOT.textContent=m;}
window.addEventListener('error',function(e){bootMsg('เกิดข้อผิดพลาด: '+(e.message||'ไม่ทราบสาเหตุ')+' — แตะเพื่อปิด',true);});
BOOT.addEventListener('click',function(){BOOT.hidden=true;});

/* ===== RULES ===== */
/* ตัวเลขฐาน (4 คน) — แก้ได้ถ้าฉบับของคุณต่างจากนี้ */
const MT=[5,6,7,8,9,10],H={5:4,6:4,7:3,8:3,9:2,10:2},TK={5:10,6:9,7:8,8:7,9:6,10:5},MAXP=8;
/* เหรียญต่อกอง: 2–4 คนตามต้นฉบับ, 5–8 คน (กติกาขยาย) เพิ่ม 20% ของจำนวนเดิมต่อผู้เล่นที่เกิน 4 คน */
function TOK(n){const o={};MT.forEach(m=>{o[m]=n<=2?TK[m]-2:n===3?TK[m]-1:n===4?TK[m]:Math.round(TK[m]*(10+2*(n-4))/10);});return o;}
/* โบนัสครบชุด: จำนวนแผ่น = max(4, ผู้เล่น) ไล่ค่า 15 → 6 (4 แผ่น = 15,12,9,6 ตามต้นฉบับ) */
function BONL(n){const k=Math.max(4,n),o=[];for(let i=0;i<k;i++)o.push(Math.round(15-9*i/(k-1)));return o;}
const COL=['#e4572e','#2e86de','#f2b134','#8e5bd6','#22a06b','#e84393','#14b8a6','#8a5a3c'];
const COLN=['ส้ม','ฟ้า','เหลือง','ม่วง','เขียว','ชมพู','เทอร์ควอยซ์','น้ำตาล'];
const BOTN=['ภูผา','ดอยคำ','หมอกฟ้า','ผาแดง','ยอดดอย','สายหมอก','พนาไพร','ผาหิน'];
const DIFF={easy:'ง่าย',normal:'ปกติ',hard:'ยาก'},DIFF_D={easy:'ตัดสินใจหลวม ๆ บางครั้งเดินแบบสุ่ม',normal:'คิดเรื่องคะแนน ความเสี่ยงโดนไล่ และชุดโบนัส',hard:'เลือกตาที่ดีที่สุดเสมอ และกดดันคู่แข่ง'};
const PIPS={1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const STAT={idle:'ยังไม่เชื่อมต่อ',waiting:'รอรหัสตอบกลับ',connecting:'กำลังเชื่อมต่อ…',connected:'เชื่อมต่อแล้ว',disconnected:'หลุดการเชื่อมต่อ',failed:'เชื่อมต่อไม่สำเร็จ'};

/* ===== UTIL ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CRY=false;try{crypto.getRandomValues(new Uint32Array(1));CRY=true;}catch(e){}
function rnd(n){if(CRY){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a);}while(a[0]>=lim);return a[0]%n;}return Math.floor(Math.random()*n);}
const clone=o=>JSON.parse(JSON.stringify(o));
function rid(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=A[rnd(A.length)];return s;}
function cleanName(v,fb){v=String(v==null?'':v).replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,16);return v||fb;}
let LS=null;try{LS=window.localStorage;LS.setItem('__t','1');LS.removeItem('__t');}catch(e){LS=null;}
function load(k,d){try{const v=LS&&LS.getItem('mg5_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{if(LS)LS.setItem('mg5_'+k,JSON.stringify(v));}catch(e){}}

/* ===== ENGINE (pure rules) ===== */
const E=(function(){
  const PARTS=[];(function rec(i,b){if(i===4){PARTS.push(b.map(x=>x.slice()));return;}for(const g of b){g.push(i);rec(i+1,b);g.pop();}b.push([i]);rec(i+1,b);b.pop();})(0,[]);
  const zero=()=>{const o={};MT.forEach(m=>o[m]=0);return o;};
  function create(ps,first){const n=ps.length;
    return{v:1,id:rid(),seq:0,players:ps.map((p,i)=>({name:cleanName(p.name,'ผู้เล่น '+(i+1)),color:/^#[0-9a-f]{6}$/i.test(p.color||'')?p.color:COL[i%COL.length],kind:p.kind==='bot'?'bot':'human',diff:p.kind==='bot'?(DIFF[p.diff]?p.diff:'normal'):null,seat:Number.isInteger(p.seat)?p.seat:i,goats:zero(),tokens:zero(),bonus:[]})),
      supply:TOK(n),bonus:BONL(n),first:first||0,cur:first||0,round:1,phase:'roll',dice:null,endTrig:false,endWhy:null,over:false,log:[]};}
  function checkFaces(d,f){if(!Array.isArray(f)||f.length!==4)return'ข้อมูลลูกเต๋าไม่ถูกต้อง';let ones=0,kept=0;
    for(let i=0;i<4;i++){const x=f[i];if(!Number.isInteger(x)||x<1||x>6)return'ค่าลูกเต๋าไม่ถูกต้อง';if(d[i]===1){ones++;if(x===1)kept++;}else if(x!==d[i])return'เปลี่ยนค่าได้เฉพาะลูกที่ทอยได้ 1';}
    if(ones&&!kept)return'ต้องเหลือหน้า 1 อย่างน้อยหนึ่งลูก';return null;}
  function checkGroups(g,f){if(!Array.isArray(g)||g.length>4)return{e:'การจัดกลุ่มไม่ถูกต้อง'};const used={},sums=[];
    for(const grp of g){if(!Array.isArray(grp)||!grp.length||grp.length>4)return{e:'กลุ่มลูกเต๋าไม่ถูกต้อง'};let t=0;
      for(const i of grp){if(!Number.isInteger(i)||i<0||i>3||used[i])return{e:'ลูกเต๋าหนึ่งลูกอยู่ได้เพียงกลุ่มเดียว'};used[i]=1;t+=f[i];}
      if(t<5||t>10)return{e:'ผลรวม '+t+' ใช้ไม่ได้ (ต้องได้ 5–10)'};sums.push(t);}
    return{sums};}
  function take(s,pi,m,ev){if(s.supply[m]>0){s.supply[m]--;s.players[pi].tokens[m]++;ev.push({k:'token',p:pi,m});}else ev.push({k:'empty',p:pi,m});}
  function step(s,pi,m,ev){const p=s.players[pi],h=H[m];
    if(p.goats[m]<h){p.goats[m]++;ev.push({k:'move',p:pi,m,to:p.goats[m]});
      if(p.goats[m]===h){s.players.forEach((o,oi)=>{if(oi!==pi&&o.goats[m]===h){o.goats[m]=0;ev.push({k:'knock',p:pi,v:oi,m});}});ev.push({k:'summit',p:pi,m});take(s,pi,m,ev);}}
    else take(s,pi,m,ev);}
  function apply(s0,a,actor,rng){rng=rng||rnd;
    if(!s0||s0.over)return{e:'เกมจบแล้ว'};if(!a||typeof a!=='object')return{e:'คำสั่งไม่ถูกต้อง'};if(actor!==s0.cur)return{e:'ยังไม่ถึงตาของผู้เล่นนี้'};
    const s=clone(s0),ev=[];
    if(a.type==='roll'){if(s.phase!=='roll')return{e:'ทอยไปแล้วในตานี้'};s.dice=[0,0,0,0].map(()=>1+rng(6));s.phase='assign';s.seq++;ev.push({k:'roll'});return{s,ev};}
    if(a.type==='commit'){if(s.phase!=='assign')return{e:'ต้องทอยลูกเต๋าก่อน'};
      const fe=checkFaces(s.dice,a.faces);if(fe)return{e:fe};const gr=checkGroups(a.groups,a.faces);if(gr.e)return{e:gr.e};
      const pi=s.cur,p=s.players[pi];gr.sums.forEach(m=>step(s,pi,m,ev));
      const sets=Math.min.apply(null,MT.map(m=>p.tokens[m]));while(p.bonus.length<sets&&s.bonus.length){const b=s.bonus.shift();p.bonus.push(b);ev.push({k:'bonus',p:pi,b});}
      s.log.push({p:pi,d:s.dice.slice(),f:a.faces.slice(),sums:gr.sums,ev:ev.slice(),note:p.kind==='bot'&&typeof a.note==='string'?a.note.slice(0,120):''});
      if(!s.endTrig){const em=MT.filter(m=>s.supply[m]===0).length;if(em>=3||!s.bonus.length){s.endTrig=true;s.endWhy=em>=3?'piles':'bonus';ev.push({k:'endTrig'});s.log.push({sys:'end',why:s.endWhy});}}
      const nx=(s.cur+1)%s.players.length;
      if(s.endTrig&&nx===s.first){s.over=true;s.phase='over';s.dice=null;ev.push({k:'over'});s.log.push({sys:'over'});}
      else{if(nx===s.first)s.round++;s.cur=nx;s.phase='roll';s.dice=null;}
      if(s.log.length>60)s.log.splice(0,s.log.length-60);s.seq++;return{s,ev};}
    return{e:'ไม่รู้จักคำสั่งนี้'};}
  function variants(d){const ones=[];d.forEach((x,i)=>{if(x===1)ones.push(i);});if(ones.length<2)return[d.slice()];
    const ch=ones.slice(1),out=[],tot=Math.pow(6,ch.length);for(let c=0;c<tot;c++){const f=d.slice();let x=c;ch.forEach(i=>{f[i]=1+x%6;x=Math.floor(x/6);});out.push(f);}return out;}
  function options(d){const map={};variants(d).forEach(f=>PARTS.forEach(part=>{
      const ok=part.filter(b=>{const t=b.reduce((a,i)=>a+f[i],0);return t>=5&&t<=10;});
      for(let mask=0;mask<(1<<ok.length);mask++){const g=ok.filter((_,j)=>mask&(1<<j)),ms=g.map(b=>b.reduce((a,i)=>a+f[i],0)).sort((a,b)=>a-b),k=ms.join(',');
        if(!map[k])map[k]={faces:f.slice(),groups:g.map(b=>b.slice()),ms};}}));
    return Object.keys(map).map(k=>map[k]);}
  const score=p=>MT.reduce((a,m)=>a+p.tokens[m]*m,0)+p.bonus.reduce((a,b)=>a+b,0);
  const summits=p=>MT.filter(m=>p.goats[m]===H[m]).length;
  function result(s){const rows=s.players.map((p,i)=>({i,name:p.name,color:p.color,tokens:p.tokens,bonus:p.bonus,tp:MT.reduce((a,m)=>a+p.tokens[m]*m,0),total:score(p),sm:summits(p)})).sort((a,b)=>b.total-a.total||b.sm-a.sm);
    const t=rows[0];return{rows,win:rows.filter(r=>r.total===t.total&&r.sm===t.sm).map(r=>r.i)};}
  function valid(s){try{
    if(!s||s.v!==1||typeof s.id!=='string'||s.id.length>12||!Number.isInteger(s.seq))return false;
    const P=s.players;if(!Array.isArray(P)||P.length<2||P.length>MAXP)return false;const n=P.length,BL=BONL(n),TT=TOK(n);
    for(const p of P){if(!p||typeof p.name!=='string'||p.name.length>20||!/^#[0-9a-f]{6}$/i.test(p.color)||(p.kind!=='human'&&p.kind!=='bot')||(p.diff!==null&&!DIFF[p.diff])||!Number.isInteger(p.seat)||p.seat<0||p.seat>=MAXP||!Array.isArray(p.bonus)||p.bonus.some(b=>BL.indexOf(b)<0)||!p.goats||!p.tokens)return false;
      for(const m of MT){const g=p.goats[m],t=p.tokens[m];if(!Number.isInteger(g)||g<0||g>H[m]||!Number.isInteger(t)||t<0)return false;}}
    for(const m of MT){const v=s.supply&&s.supply[m];if(!Number.isInteger(v)||v<0)return false;if(v+P.reduce((a,p)=>a+p.tokens[m],0)!==TT[m])return false;if(P.filter(p=>p.goats[m]===H[m]).length>1)return false;}
    if(!Array.isArray(s.bonus)||s.bonus.some(b=>BL.indexOf(b)<0)||s.bonus.length+P.reduce((a,p)=>a+p.bonus.length,0)!==BL.length)return false;
    if(!Number.isInteger(s.cur)||s.cur<0||s.cur>=n||!Number.isInteger(s.first)||s.first<0||s.first>=n||!Number.isInteger(s.round))return false;
    if(s.phase==='assign'){if(!Array.isArray(s.dice)||s.dice.length!==4||s.dice.some(d=>!Number.isInteger(d)||d<1||d>6))return false;}
    else if((s.phase!=='roll'&&s.phase!=='over')||s.dice!==null)return false;
    if(s.over!==(s.phase==='over')||typeof s.endTrig!=='boolean')return false;
    if(!Array.isArray(s.log)||s.log.length>80)return false;
    for(const e of s.log){if(!e||typeof e!=='object')return false;if(e.sys){if(e.sys!=='end'&&e.sys!=='over')return false;continue;}
      if(!Number.isInteger(e.p)||e.p<0||e.p>=n||!Array.isArray(e.d)||!Array.isArray(e.f)||!Array.isArray(e.sums)||!Array.isArray(e.ev)||typeof e.note!=='string'||e.d.concat(e.f,e.sums).some(x=>!Number.isInteger(x)))return false;}
    return true;}catch(e){return false;}}
  return{PARTS,create,apply,variants,options,score,summits,result,valid,checkFaces,checkGroups};
})();

/* ===== AI ===== */
const AI=(function(){
  let P=null;
  function probs(){if(P)return P;const h1={},h2={};MT.forEach(m=>{h1[m]=0;h2[m]=0;});const d=[0,0,0,0];
    for(d[0]=1;d[0]<7;d[0]++)for(d[1]=1;d[1]<7;d[1]++)for(d[2]=1;d[2]<7;d[2]++)for(d[3]=1;d[3]<7;d[3]++){const best={};
      E.variants(d).forEach(f=>E.PARTS.forEach(part=>{const c={};part.forEach(b=>{const t=b.reduce((a,i)=>a+f[i],0);if(t>=5&&t<=10)c[t]=(c[t]||0)+1;});for(const k in c)if(!best[k]||c[k]>best[k])best[k]=c[k];}));
      MT.forEach(m=>{if(best[m]>=1)h1[m]++;if(best[m]>=2)h2[m]++;});}
    MT.forEach(m=>{h1[m]/=1296;h2[m]/=1296;});return(P={h1,h2});}
  const W={easy:{pr:.6,ho:.4,se:.2,op:0,no:5,ra:.35},normal:{pr:1,ho:1,se:.6,op:.35,no:1.2,ra:0},hard:{pr:1.1,ho:1.3,se:.9,op:.6,no:0,ra:0}};
  function late(s){if(s.endTrig)return 1;const e=MT.filter(m=>!s.supply[m]).length,l=MT.filter(m=>s.supply[m]===1).length;return Math.min(.85,e*.28+l*.08+(s.bonus.length<=1?.3:0));}
  function pv(s,pi,w){const pr=probs(),h1=pr.h1,h2=pr.h2,p=s.players[pi],L=late(s);let v=E.score(p);
    MT.forEach(m=>{const h=H[m],pos=p.goats[m],sup=s.supply[m];if(!sup){if(pos===h)v+=.3;return;}const sc=Math.min(1,sup/3);
      if(pos===h){let safe=1;s.players.forEach((o,oi)=>{if(oi===pi)return;const d=h-o.goats[m];if(d===1)safe*=1-h1[m];else if(d===2)safe*=1-h2[m];});v+=w.ho*m*h1[m]*(.5+1.5*safe)*sc*(1-L*.85)+m*.1;}
      else v+=w.pr*m*h1[m]*Math.pow(pos/h,1.4)*(1-L*.9)*sc;});
    if(s.bonus.length){const sets=Math.min.apply(null,MT.map(m=>p.tokens[m])),have=MT.filter(m=>p.tokens[m]>sets).length;
      if(MT.every(m=>p.tokens[m]>sets||s.supply[m]>0))v+=w.se*s.bonus[0]*Math.pow(have/6,2)*(1-L*.7);}
    return v;}
  function evalS(s,me,w){let sum=0,best=-1e9;s.players.forEach((_,i)=>{if(i===me)return;const v=pv(s,i,w);sum+=v;if(v>best)best=v;});return pv(s,me,w)-w.op*(.5*best+.5*sum/(s.players.length-1));}
  function rank(st,d){const w=W[d]||W.normal,s=Object.assign({},st,{log:[]}),me=s.cur,b=E.score(s.players[me]);
    return E.options(s.dice).map(o=>{const a={type:'commit',faces:o.faces,groups:o.groups},r=E.apply(s,a,me,()=>0);return r.e?null:{a,ms:o.ms,ev:r.ev,val:evalS(r.s,me,w),gain:E.score(r.s.players[me])-b};}).filter(Boolean).sort((x,y)=>y.val-x.val);}
  function explain(pk,s){const parts=[],tk={};pk.ev.forEach(e=>{if(e.k==='knock')parts.push('ไล่แพะของ '+s.players[e.v].name+' ลงจากยอด '+e.m);if(e.k==='token')tk[e.m]=(tk[e.m]||0)+1;if(e.k==='bonus')parts.push('ครบชุด รับโบนัส '+e.b);});
    const t=Object.keys(tk);if(t.length)parts.push('เก็บเหรียญ '+t.map(m=>m+(tk[m]>1?' ×'+tk[m]:'')).join(', '));
    if(!parts.length)parts.push(pk.ms.length?'ไต่ภูเขา '+pk.ms.filter((x,i,a)=>a.indexOf(x)===i).join(', ')+' เพื่อเตรียมขึ้นยอด':'ไม่มีการเดินที่คุ้มค่า จึงผ่านตา');return parts.join(' · ');}
  function choose(s,d,R){R=R||Math.random;const w=W[d]||W.normal,L=rank(s,d);
    if(!L.length)return{action:{type:'commit',faces:s.dice.slice(),groups:[],note:'ผ่านตา'},note:'ผ่านตา'};
    let pk;if(w.ra&&R()<w.ra){const mv=L.filter(o=>o.ms.length);pk=mv.length?mv[Math.floor(R()*mv.length)]:L[0];}
    else if(w.no)pk=L.map(o=>({o,v:o.val+(R()*2-1)*w.no})).sort((a,b)=>b.v-a.v)[0].o;else pk=L[0];
    const note=explain(pk,s);return{action:Object.assign({},pk.a,{note}),note};}
  return{rank,choose};
})();

  setState(ex||E.create(ps,first),[]);if(!CFG.tut&&mode!=='guest')openModal({type:'tut',i:0});}
function setState(s,ev){const p=G.s;ev=ev||[];G.s=s;
  if(p&&p.id!==s.id&&G.modal&&G.modal.type==='end')G.modal=null;
  if(!p||p.id!==s.id||p.cur!==s.cur||p.phase!==s.phase||p.round!==s.round)resetUi();
  if(isNet())G.me=Math.max(0,s.players.findIndex(x=>x.seat===(G.mode==='host'?0:NET.slot)));else G.me=0;
  G.fx={};playFx(ev);
  if(ev.some(e=>e.k==='roll')){G.rolling=true;clearTimeout(G.timers.roll);G.timers.roll=setTimeout(()=>{G.rolling=false;render();},CFG.motion?0:650);}

  else{handover(p);sched();}}
function act(a,who){const s=G.s;if(!s)return false;
  if(G.mode==='guest'){if(G.pending)return false;const pre=E.apply(s,a,who,()=>0);if(pre.e){toast(pre.e,'err');return false;}
    if(!NET.conn||!NET.conn.send({t:'act',a:{type:a.type,faces:a.faces,groups:a.groups},seq:s.seq})){toast('ส่งคำสั่งไม่ได้ — ขาดการเชื่อมต่อกับโฮสต์','err');return false;}
    G.pending=true;clearTimeout(G.timers.pend);G.timers.pend=setTimeout(()=>{if(G.pending){G.pending=false;render();toast('โฮสต์ไม่ตอบกลับ ลองอีกครั้ง','warn');}},10000);render();return true;}
  const r=E.apply(s,a,who);if(r.e){toast(r.e,'err');snd('err');return false;}
  setState(r.s,r.ev);if(G.mode==='host')hostBroadcast(r.ev);return true;}
function playFx(ev){let mv=false;ev.forEach(e=>{
  if(e.k==='roll')snd('roll');if(e.k==='move'){G.fx['g'+e.p+':'+e.m]=1;mv=true;}if(e.k==='summit'){G.fx[e.m+':'+H[e.m]]='burst';snd('summit');}
  if(e.k==='token'){G.fx['pt'+e.m]=1;snd('token');}if(e.k==='knock'){G.fx[e.m+':0']='shake';snd('knock');toast(nm(e.p)+' ไล่แพะของ '+nm(e.v)+' ลงจากยอดเขา '+e.m,'warn');}
  if(e.k==='bonus'){snd('bonus');toast(nm(e.p)+' สะสมครบชุด! รับโบนัส +'+e.b,'good');}if(e.k==='endTrig')toast('เงื่อนไขจบเกมครบแล้ว — เล่นต่อจนจบรอบนี้','warn');if(e.k==='over')snd('end');});
  if(mv)snd('move');}
function botOn(){const s=G.s;if(!s||s.over||s.players[s.cur].kind!=='bot'||(G.mode!=='bots'&&G.mode!=='host')||G.hand)return false;
  return !G.modal||(G.mode==='host'&&G.modal.type!=='tut');}
function sched(){clearTimeout(G.timers.bot);const tok=++G.botTok;if(!botOn())return;const sp={slow:1.7,normal:1,fast:.45}[CFG.speed]||1,s=G.s;
  if(s.phase==='roll'){G.timers.bot=setTimeout(()=>{if(tok===G.botTok&&botOn())act({type:'roll'},G.s.cur);},650*sp);return;}
  G.timers.bot=setTimeout(()=>{if(tok!==G.botTok||!botOn())return;let ch;
    try{ch=AI.choose(G.s,G.s.players[G.s.cur].diff);}catch(e){ch={action:{type:'commit',faces:G.s.dice.slice(),groups:[]},note:'ผ่านตา'};}

    G.timers.bot=setTimeout(()=>{if(tok!==G.botTok||!botOn())return;if(!act(ch.action,G.s.cur))act({type:'commit',faces:G.s.dice.slice(),groups:[]},G.s.cur);},1200*sp);},850*sp);}

/* ===== ONLINE (WebRTC, host-authoritative) ===== */
function enc(o){return'MG1.'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function dec(s){s=String(s||'').replace(/\s+/g,'');if(!s)throw new Error('กรุณาวางรหัสก่อน');if(s.length>60000)throw new Error('รหัสยาวผิดปกติ');
  if(s.indexOf('MG1.')!==0)throw new Error('รูปแบบรหัสไม่ถูกต้อง — ต้องขึ้นต้นด้วย MG1. และคัดลอกให้ครบ');
  let o;try{o=JSON.parse(decodeURIComponent(escape(atob(s.slice(4)))));}catch(e){throw new Error('รหัสเสียหายหรือคัดลอกมาไม่ครบ');}
  if(!o||o.p!==1)throw new Error('เวอร์ชันเกมไม่ตรงกัน');if(o.k!=='offer'&&o.k!=='answer')throw new Error('ชนิดรหัสไม่ถูกต้อง');
  if(typeof o.room!=='string'||!/^[A-Z0-9]{6}$/.test(o.room))throw new Error('รหัสห้องไม่ถูกต้อง');if(!Number.isInteger(o.slot)||o.slot<1||o.slot>MAXP-1)throw new Error('ที่นั่งไม่ถูกต้อง');
  if(typeof o.sdp!=='string'||o.sdp.indexOf('v=0')!==0||o.sdp.length>40000)throw new Error('ข้อมูลการเชื่อมต่อไม่ถูกต้อง');return o;}
function iceDone(pc){return new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const t=setTimeout(r,5000);const h=()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);pc.removeEventListener('icegatheringstatechange',h);r();}};pc.addEventListener('icegatheringstatechange',h);});}
function mkConn(h){const c={pc:new RTCPeerConnection({iceServers:CFG.stun?[{urls:'stun:stun.l.google.com:19302'}]:[]}),dc:null,status:'waiting',last:Date.now(),h:h,closed:false,to:0};
  c.set=st=>{if(c.closed||c.status===st)return;c.status=st;if(c.h.status)c.h.status(st);};
  c.pc.onconnectionstatechange=()=>{const st=c.pc.connectionState;if(st==='failed')c.set('failed');else if(st==='disconnected'&&c.status==='connected')c.set('disconnected');else if(st==='connected'&&c.dc&&c.dc.readyState==='open')c.set('connected');};
  c.bind=dc=>{c.dc=dc;dc.onopen=()=>{clearTimeout(c.to);c.last=Date.now();c.set('connected');if(c.h.open)c.h.open();};dc.onclose=()=>{if(!c.closed)c.set('disconnected');};
    dc.onmessage=e=>{if(typeof e.data!=='string'||e.data.length>300000)return;let m;try{m=JSON.parse(e.data);}catch(x){return;}if(!m||m.v!==1||typeof m.t!=='string')return;
      c.last=Date.now();if(c.status==='disconnected')c.set('connected');try{if(c.h.msg)c.h.msg(m);}catch(x){console.error(x);}};};
  c.send=o=>{if(c.dc&&c.dc.readyState==='open'){try{c.dc.send(JSON.stringify(Object.assign({v:1},o)));return true;}catch(e){}}return false;};
  c.arm=ms=>{clearTimeout(c.to);c.to=setTimeout(()=>{if(c.status!=='connected')c.set('failed');},ms);};
  c.close=()=>{c.closed=true;clearTimeout(c.to);try{if(c.dc)c.dc.close();}catch(e){}try{c.pc.close();}catch(e){}};return c;}
function closeConn(c,bye,reason){if(!c)return;c.h={};if(bye)c.send({t:'bye',reason:reason||''});setTimeout(()=>c.close(),bye?200:0);}
function teardown(bye){NET.seats.forEach(s=>{if(s.conn)closeConn(s.conn,bye);});if(NET.conn)closeConn(NET.conn,bye);clearInterval(NET.beat);
  Object.assign(NET,{role:null,room:'',seats:[],slot:0,conn:null,lobby:null,started:false,hostClosed:false,answer:'',beat:0,busy:false});}
function startBeat(){clearInterval(NET.beat);NET.beat=setInterval(()=>{const cs=NET.role==='host'?NET.seats.map(s=>s.conn).filter(Boolean):(NET.conn?[NET.conn]:[]);
  cs.forEach(c=>{if(c.dc&&c.dc.readyState==='open')c.send({t:'ping'});if(c.status==='connected'&&Date.now()-c.last>15000)c.set('disconnected');});},4000);}

async function invite(v){const st=NET.seats[+v];if(!st||st.busy||st.kind==='host')return;if(typeof RTCPeerConnection!=='function'){toast('หน้าต่างนี้ไม่รองรับ WebRTC','err');return;}

    await c.pc.setLocalDescription(await c.pc.createOffer());await iceDone(c.pc);if(st.conn===c)st.code=enc({p:1,k:'offer',room:NET.room,slot,host:NET.name,sdp:c.pc.localDescription.sdp});}
  catch(e){st.err='สร้างคำเชิญไม่สำเร็จ — ลองอีกครั้ง';st.status='failed';}st.busy=false;render();}
async function accept(v){const st=NET.seats[+v];if(!st||!st.conn)return;let o;try{o=dec(G.form['ans'+st.slot]);}catch(e){st.err=e.message;return render();}
  if(o.k!=='answer'){st.err='นี่เป็นรหัสเชิญ ไม่ใช่รหัสตอบกลับ';return render();}if(o.room!==NET.room){st.err='รหัสนี้มาจากห้องอื่น';return render();}
  if(o.slot!==st.slot){st.err='รหัสนี้เป็นของที่นั่ง '+(o.slot+1);return render();}
  if(st.conn.pc.signalingState!=='have-local-offer'){st.err='คำเชิญนี้ใช้ไปแล้ว — กดสร้างคำเชิญใหม่';return render();}
  try{st.conn.set('connecting');await st.conn.pc.setRemoteDescription({type:'answer',sdp:o.sdp});st.conn.arm(CFG.timeout*1000);st.err='';}catch(e){st.err='รหัสตอบกลับใช้ไม่ได้ — สร้างคำเชิญใหม่แล้วลองอีกครั้ง';}render();}
function hostStatus(slot,x){const st=NET.seats[slot];if(!st)return;const prev=st.status;st.status=x;if(x==='connected'){st.code='';st.err='';}
  if((x==='disconnected'||x==='failed')&&prev==='connected')toast((st.name||'ที่นั่ง '+(slot+1))+' ขาดการเชื่อมต่อ','warn');
  if(x==='failed'&&prev!=='connected')st.err='เชื่อมต่อไม่สำเร็จในเวลาที่กำหนด — เครือข่ายอาจต้องใช้ TURN relay ลองสร้างคำเชิญใหม่ หรือใช้ Wi-Fi เดียวกัน';lobbyCast();render();}
function hostMsg(slot,m){const st=NET.seats[slot];if(!st||!st.conn)return;
  if(m.t==='hello'){st.name=cleanName(m.name,'ผู้เล่น '+(slot+1));st.kind='human';st.conn.send({t:'welcome',slot,room:NET.room});
    if(NET.started&&G.s){const i=G.s.players.findIndex(p=>p.seat===slot);if(i>=0&&G.s.players[i].kind==='bot')mutate(s=>{s.players[i].kind='human';s.players[i].diff=null;});
      st.conn.send({t:'state',s:G.s,ev:[]});toast((i>=0?G.s.players[i].name:st.name)+' กลับมาเชื่อมต่อแล้ว','good');}else toast(st.name+' เข้าห้องแล้ว','good');lobbyCast();render();}
  else if(m.t==='act')hostAct(slot,m);else if(m.t==='ping')st.conn.send({t:'pong'});else if(m.t==='bye')st.conn.set('disconnected');}
function hostAct(slot,m){const c=NET.seats[slot].conn,s=G.s;const no=t=>{c.send({t:'err',msg:t});if(G.s)c.send({t:'state',s:G.s,ev:[]});};
  if(!NET.started||!s||G.mode!=='host')return no('เกมยังไม่เริ่ม');const a=m.a;if(!a||typeof a!=='object'||(a.type!=='roll'&&a.type!=='commit')||!Number.isInteger(m.seq))return no('คำสั่งไม่ถูกต้อง');
  if(m.seq!==s.seq)return no('สถานะเกมเปลี่ยนไปแล้ว — ซิงก์กระดานใหม่ให้แล้ว');const who=s.players.findIndex(p=>p.seat===slot);
  if(who<0||s.players[who].kind!=='human')return no('ที่นั่งนี้ไม่ได้ควบคุมโดยผู้เล่น');
  const r=E.apply(s,{type:a.type,faces:a.faces,groups:a.groups},who);if(r.e)return no(r.e);setState(r.s,r.ev);hostBroadcast(r.ev);}
function mutate(fn){if(G.mode!=='host'||!G.s)return;const s=clone(G.s);fn(s);s.seq++;if(!E.valid(s))return;setState(s,[]);hostBroadcast([]);}
function hostBroadcast(ev){if(NET.role!=='host'||!G.s)return;NET.seats.forEach(st=>{if(st.conn&&st.status==='connected'&&st.kind==='human')st.conn.send({t:'state',s:G.s,ev:ev||[]});});}
function lobbyCast(){if(NET.role!=='host')return;const l={seats:NET.seats.map(st=>({slot:st.slot,name:st.kind==='host'?NET.name:st.kind==='bot'?BOTN[st.slot]+' (บอท)':st.name,kind:st.kind,status:st.kind==='host'?'connected':st.kind==='bot'?'bot':st.status}))};
  NET.seats.forEach(st=>{if(st.conn&&st.status==='connected'&&st.kind==='human')st.conn.send({t:'lobby',l});});}
const ready=()=>NET.seats.every(st=>st.kind==='host'||st.kind==='bot'||(st.kind==='human'&&st.status==='connected'));
function hostStart(){if(NET.role!=='host'||NET.started)return;if(!ready()){toast('ยังมีที่นั่งที่ไม่พร้อม — เชิญผู้เล่นหรือใส่บอท','warn');return;}
  const ps=NET.seats.map(st=>st.kind==='host'?{name:NET.name,kind:'human',seat:0}:st.kind==='bot'?{name:BOTN[st.slot],kind:'bot',diff:st.diff,seat:st.slot}:{name:st.name,kind:'human',seat:st.slot});
  NET.started=true;G.gameCfg={ps};begin('host',ps,rnd(ps.length));hostBroadcast([]);}
function setBot(v){const st=NET.seats[+v];if(!st||st.kind==='host')return;closeConn(st.conn,true,'seat');st.conn=null;Object.assign(st,{code:'',err:'',status:'idle',kind:'bot'});
  if(NET.started&&G.s){const i=G.s.players.findIndex(p=>p.seat===st.slot);if(i>=0&&G.s.players[i].kind!=='bot')mutate(s=>{s.players[i].kind='bot';s.players[i].diff=st.diff||'normal';});}lobbyCast();render();}
function guestH(){return{status:x=>{if(x==='connected'){toast('เชื่อมต่อกับโฮสต์แล้ว','good');G.form.jerr='';}if(x==='failed'){G.form.jerr='เชื่อมต่อไม่สำเร็จ: 1) ตรวจว่าโฮสต์วางรหัสตอบกลับแล้วกด “เชื่อมต่อ” 2) ขอรหัสเชิญใหม่ (ใช้ได้ครั้งเดียว) 3) ลองใช้ Wi-Fi เดียวกันหรือปิด VPN 4) บางเครือข่ายต้องใช้ TURN relay ซึ่งเกมนี้ไม่มี — ถ้ายังไม่ได้ ให้เล่นกับบอทหรือในเครื่องเดียวแทน';toast('เชื่อมต่อไม่สำเร็จ','err');}
    if(x==='disconnected')toast('ขาดการเชื่อมต่อกับโฮสต์','warn');if(x==='connected'&&G.modal&&G.modal.type==='rejoin')G.modal=null;render();},
  open:()=>{if(NET.conn)NET.conn.send({t:'hello',name:NET.name});},msg:guestMsg};}
async function mkAnswer(o){const c=mkConn(guestH());NET.conn=c;c.pc.ondatachannel=e=>c.bind(e.channel);await c.pc.setRemoteDescription({type:'offer',sdp:o.sdp});
  await c.pc.setLocalDescription(await c.pc.createAnswer());await iceDone(c.pc);c.set('connecting');c.arm(180000);return enc({p:1,k:'answer',room:o.room,slot:o.slot,sdp:c.pc.localDescription.sdp});}
async function join(){const f=G.form;f.jerr='';if(typeof RTCPeerConnection!=='function'){f.jerr='หน้าต่างนี้ไม่รองรับ WebRTC';return render();}
  let o;try{o=dec(f.inv);}catch(e){f.jerr=e.message;return render();}if(o.k!=='offer'){f.jerr='นี่เป็นรหัสตอบกลับ ไม่ใช่รหัสเชิญจากโฮสต์';return render();}
  teardown(false);Object.assign(NET,{role:'guest',room:o.room,slot:o.slot,hostName:cleanName(o.host,'โฮสต์'),name:cleanName(f.jn,'ผู้เล่น'),busy:true});CFG.name=NET.name;saveCfg();render();
  try{NET.answer=await mkAnswer(o);startBeat();}catch(e){teardown(false);f.jerr='สร้างรหัสตอบกลับไม่สำเร็จ — รหัสเชิญอาจหมดอายุ';}NET.busy=false;render();}
async function rejoinGo(){const f=G.form;f.rjerr='';let o;try{o=dec(f.rj);}catch(e){f.rjerr=e.message;return render();}
  if(o.k!=='offer'){f.rjerr='นี่ไม่ใช่รหัสเชิญ';return render();}if(o.room!==NET.room){f.rjerr='รหัสนี้เป็นของห้องอื่น';return render();}if(o.slot!==NET.slot){f.rjerr='รหัสนี้เป็นของที่นั่ง '+(o.slot+1)+' ไม่ใช่ของคุณ';return render();}
  if(NET.conn)closeConn(NET.conn,false);NET.hostClosed=false;try{f.rjout=await mkAnswer(o);}catch(e){f.rjerr='สร้างรหัสตอบกลับไม่สำเร็จ';}render();}
const EVK=['roll','move','summit','token','empty','knock','bonus','endTrig','over'];
function guestMsg(m){
  if(m.t==='lobby'){const l=m.l;NET.lobby=l&&Array.isArray(l.seats)?l.seats.slice(0,MAXP).filter(x=>x&&Number.isInteger(x.slot)&&x.slot>=0&&x.slot<MAXP).map(x=>({slot:x.slot,name:cleanName(x.name,'ที่นั่งว่าง'),kind:String(x.kind),status:STAT[x.status]?x.status:(x.status==='bot'?'bot':'idle')})):null;render();}
  else if(m.t==='state'){const s=m.s;if(!E.valid(s)){toast('ได้รับข้อมูลเกมที่ไม่ถูกต้องจากโฮสต์ — ไม่นำมาใช้','err');return;}if(!s.players.some(p=>p.seat===NET.slot))return;
    if(G.mode==='guest'&&G.s&&G.s.id===s.id&&s.seq<G.s.seq)return;G.pending=false;NET.started=true;const n=s.players.length,BL=BONL(n),okP=v=>v===undefined||(Number.isInteger(v)&&v>=0&&v<n);
    const ev=Array.isArray(m.ev)?m.ev.slice(0,60).filter(e=>e&&EVK.indexOf(e.k)>=0&&(e.m===undefined||MT.indexOf(e.m)>=0)&&okP(e.p)&&okP(e.v)&&(e.b===undefined||BL.indexOf(e.b)>=0)).map(e=>({k:e.k,m:e.m,p:e.p,v:e.v,b:e.b,to:Number.isInteger(e.to)?e.to:0})):[];
    if(G.mode!=='guest'){stopTimers();G.mode='guest';G.screen='game';G.s=null;G.modal=null;G.lastCur='';}setState(s,ev);}
  else if(m.t==='err'){G.pending=false;toast(String(m.msg||'คำสั่งไม่ถูกต้อง').slice(0,140),'err');render();}
  else if(m.t==='bye'){NET.hostClosed=m.reason!=='seat';toast(m.reason==='seat'?'โฮสต์ให้บอทเล่นแทนคุณ — ขอรหัสเชิญใหม่เพื่อกลับมา':'โฮสต์ปิดห้องแล้ว','warn');const c=NET.conn;NET.conn=null;closeConn(c,false);render();}
  else if(m.t==='ping'){if(NET.conn)NET.conn.send({t:'pong'});}}
function diag(){const L=['protocol=1','webrtc='+(typeof RTCPeerConnection==='function'?'yes':'no'),'storage='+(LS?'yes':'no'),'role='+(NET.role||'-'),'room='+(NET.room||'-'),'stun='+(CFG.stun?'stun.l.google.com:19302':'off'),'turn=(none)','timeout='+CFG.timeout+'s'];

  if(NET.conn)L.push('host-link: '+NET.conn.status+' / '+NET.conn.pc.connectionState+' / ice='+NET.conn.pc.iceConnectionState);return L.join('\n');}

  if(id){const n=document.getElementById(id);if(n&&!n.disabled){try{n.focus({preventScroll:true});if(ss!==null&&n.setSelectionRange&&!n.readOnly)n.setSelectionRange(ss,ss);}catch(e){}}}}

function leaveGame(){stopTimers();if(isNet())teardown(true);G.mode=null;G.s=null;G.modal=null;G.hand=false;G.pending=false;G.screen='menu';render();}

/* ===== TESTS ===== */
function seeded(seed){let a=seed>>>0;return n=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return Math.floor((((t^(t>>>14))>>>0)/4294967296)*n);};}
function runTests(){const out=[],T=(n,c)=>out.push([n,!!c]);const P=n=>Array.from({length:n},(_,i)=>({name:'P'+i,kind:'human'}));
  const at=(dice,mod)=>{const s=E.create(P(2),0);s.phase='assign';s.dice=dice;if(mod)mod(s);return s;};const cm=(s,f,g)=>E.apply(s,{type:'commit',faces:f,groups:g},s.cur);
  try{T('2 คน: เหรียญลดกองละ 2',MT.every(m=>E.create(P(2),0).supply[m]===TK[m]-2));T('3 คน: เหรียญลดกองละ 1',MT.every(m=>E.create(P(3),0).supply[m]===TK[m]-1));
    T('4 คน: เหรียญเต็มกองตามต้นฉบับ',MT.every(m=>E.create(P(4),0).supply[m]===TK[m]));T('2–4 คน: โบนัส 15·12·9·6',[2,3,4].every(n=>BONL(n).join()==='15,12,9,6'));
    T('5–8 คน: เหรียญเพิ่มขึ้นตามจำนวนผู้เล่น',[5,6,7,8].every(n=>MT.every(m=>TOK(n)[m]>TOK(n-1)[m]||TOK(n)[m]>=TOK(n-1)[m]))&&TOK(8)[5]===18&&TOK(8)[10]===9);
    T('8 คน: โบนัส 8 แผ่น 15→6',BONL(8).length===8&&BONL(8)[0]===15&&BONL(8)[7]===6);
    T('2–8 คน: สถานะเริ่มต้นผ่านการตรวจ',[2,3,4,5,6,7,8].every(n=>E.valid(E.create(P(n),0))));
    const s0=E.create(P(2),0),rl=E.apply(s0,{type:'roll'},0,seeded(1));T('ทอยได้ 4 ลูก ค่า 1–6',!rl.e&&rl.s.dice.length===4&&rl.s.dice.every(d=>d>=1&&d<=6));
    T('ทอยซ้ำไม่ได้',!!E.apply(rl.s,{type:'roll'},0).e);T('ไม่ถึงตาถูกปฏิเสธ',!!E.apply(s0,{type:'roll'},1).e);
    T('เปลี่ยนหน้า 1 ที่เกินได้',E.checkFaces([1,1,3,4],[1,6,3,4])===null);T('ต้องเหลือหน้า 1',E.checkFaces([1,1,3,4],[6,6,3,4])!==null);T('หน้า 1 ลูกเดียวเปลี่ยนไม่ได้',E.checkFaces([1,2,3,4],[6,2,3,4])!==null);
    T('ผลรวม 11 ใช้ไม่ได้',!!E.checkGroups([[2,3]],[1,1,5,6]).e);T('ลูกเดียวสองกลุ่มไม่ได้',!!E.checkGroups([[0,1],[1,2]],[3,4,3,2]).e);
    let r=cm(at([3,4,1,6]),[3,4,1,6],[[0,1],[2,3]]);T('สองกลุ่มรวม 7 → ขึ้น 2 ช่อง',!r.e&&r.s.players[0].goats[7]===2&&r.s.cur===1);
    r=cm(at([5,5,2,2],s=>{s.players[0].goats[10]=1;s.players[1].goats[10]=2;}),[5,5,2,2],[[0,1]]);T('ถึงยอดได้เหรียญ + ไล่คู่แข่ง',!r.e&&r.s.players[0].tokens[10]===1&&r.s.players[1].goats[10]===0);
    r=cm(at([4,5,3,6],s=>{s.players[0].goats[9]=2;}),[4,5,3,6],[[0,1],[2,3]]);T('อยู่บนยอดแล้วได้เหรียญทุกกลุ่ม',!r.e&&r.s.players[0].tokens[9]===2);
    r=cm(at([4,5,3,6],s=>{s.players[0].goats[9]=2;s.players[1].tokens[9]=s.supply[9];s.supply[9]=0;}),[4,5,3,6],[[0,1],[2,3]]);T('กองหมดแล้วไม่ได้เหรียญเพิ่ม',!r.e&&r.s.players[0].tokens[9]===0);
    r=cm(at([5,5,1,1],s=>{MT.forEach(m=>{if(m!==10){s.players[0].tokens[m]=1;s.supply[m]--;}});s.players[0].goats[10]=2;}),[5,5,1,1],[[0,1]]);T('ครบ 6 ภูเขาได้โบนัส 15',!r.e&&r.s.players[0].bonus[0]===15);
    r=cm(at([3,4,2,2],s=>{s.players[1].tokens[5]=s.supply[5];s.supply[5]=0;s.players[1].tokens[6]=s.supply[6];s.supply[6]=0;s.players[1].tokens[7]=s.supply[7]-1;s.supply[7]=1;s.players[0].goats[7]=3;}),[3,4,2,2],[[0,1]]);
    T('เหรียญหมด 3 กอง → รอบสุดท้าย',!r.e&&r.s.endTrig&&!r.s.over);let r2=E.apply(r.s,{type:'roll'},1,seeded(3));r2=E.apply(r2.s,{type:'commit',faces:r2.s.dice.slice(),groups:[]},1);T('จบเมื่อครบรอบ',!r2.e&&r2.s.over);
    T('สถานะผ่านการตรวจสอบ',E.valid(r2.s));const bad=clone(r2.s);bad.supply[5]++;T('ตรวจจับเหรียญผิดปกติ',!E.valid(bad));
    const tb=E.create(P(2),0);tb.players[0].tokens[5]=2;tb.supply[5]-=2;tb.players[1].tokens[10]=1;tb.supply[10]--;tb.players[1].goats[10]=2;T('คะแนนเท่ากัน ตัดสินด้วยแพะบนยอด',E.result(tb).win.join()==='1');
    let legal=true;const rg=seeded(42);for(let k=0;k<100;k++){const d=[0,0,0,0].map(()=>1+rg(6));E.options(d).forEach(o=>{if(E.checkFaces(d,o.faces)||E.checkGroups(o.groups,o.faces).e)legal=false;});}T('ตัวเลือกที่ระบบสร้างถูกกติกาทั้งหมด',legal);
    let rej=false;try{dec('MG1.@@@');}catch(e){rej=true;}T('รหัสเชิญเสียหายถูกปฏิเสธ',rej);
    [[['hard','hard','hard','hard'],7],[['easy','normal'],11],[['normal','hard','easy'],23],[['normal','hard','easy','normal','hard','easy'],29],[['normal','normal','easy','hard','normal','easy','hard','normal'],31]].forEach(c=>{const rg2=seeded(c[1]),R=()=>rg2(1e9)/1e9;let s=E.create(c[0].map((d,i)=>({name:'B'+i,kind:'bot',diff:d})),0),n=0,ok=true;
      while(!s.over&&n<6000){const x=s.phase==='roll'?E.apply(s,{type:'roll'},s.cur,rg2):E.apply(s,AI.choose(s,s.players[s.cur].diff,R).action,s.cur);if(x.e||!E.valid(x.s)){ok=false;break;}s=x.s;n++;}
      T('จำลองเกม '+c[0].length+' บอทจนจบ ('+n+' ขั้น)',ok&&s.over);});
  }catch(e){T('ข้อผิดพลาด: '+e.message,false);}return out;}
window.MG_TESTS=()=>{const r=runTests();console.table(r);return r;};

/* ===== ACTIONS (event delegation) ===== */
const A={
  go:v=>{G.screen=v;G.form.jerr='';render();},
  form:v=>{const i=v.indexOf(':');G.form[v.slice(0,i)]=v.slice(i+1);render();},
  cfg:v=>{CFG[v]=!CFG[v];saveCfg();applyCfg();render();if(v==='sound'&&CFG.sound)snd('click');},
  speed:v=>{CFG.speed=v;saveCfg();render();},tmo:v=>{CFG.timeout=+v;saveCfg();render();},
  tut:()=>openModal({type:'tut',i:0}),tutN:()=>{if(G.modal.i<TUT.length-1){G.modal.i++;render();}else closeModal();},tutP:()=>{if(G.modal.i>0){G.modal.i--;render();}},
  rules:()=>openModal({type:'rules'}),settings:()=>openModal({type:'settings'}),pause:()=>openModal({type:'pause'}),seats:()=>openModal({type:'seats'}),log:()=>openModal({type:'log'}),
  rejoin:()=>{G.form.rj='';G.form.rjout='';G.form.rjerr='';openModal({type:'rejoin'});},rejoinGo:()=>rejoinGo(),
  mclose:()=>closeModal(),
  mok:()=>{const m=G.modal,cb=m&&m.cb;G.modal=m&&m.back?m.back:null;render();if(cb)cb();if(!G.modal&&G.s&&!G.s.over)sched();},
  startBots:()=>{const f=G.form,ci=+f.color,others=COL.map((_,i)=>i).filter(c=>c!==ci),n=Math.min(MAXP-1,Math.max(1,+f.bots));CFG.name=String(f.name||'').trim().slice(0,16);saveCfg();
    const ps=[{name:cleanName(f.name,'คุณ'),color:COL[ci],kind:'human'}];for(let i=0;i<n;i++)ps.push({name:BOTN[i],color:COL[others[i]],kind:'bot',diff:f.diff});
    G.gameCfg={ps,first:f.first};begin('bots',ps,f.first==='me'?0:rnd(ps.length));},
  startLocal:()=>{const n=Math.min(MAXP,Math.max(2,+G.form.lc)),ps=[];for(let i=0;i<n;i++)ps.push({name:cleanName(G.form['ln'+i],'ผู้เล่น '+(i+1)),color:COL[i],kind:'human'});G.gameCfg={ps};begin('local',ps,0);},
  resume:()=>{const sv=load('game',null);if(!sv||!E.valid(sv.s)||sv.s.over||(sv.mode!=='bots'&&sv.mode!=='local')){save('game',null);toast('ไม่พบเกมที่บันทึกไว้','warn');return render();}
    G.gameCfg={ps:sv.s.players.map(p=>({name:p.name,color:p.color,kind:p.kind,diff:p.diff})),first:'random'};begin(sv.mode,null,0,sv.s);},
  roll:()=>{if(canAct()&&G.s.phase==='roll')act({type:'roll'},actor());},
  die:v=>{if(!canAct()||G.s.phase!=='assign')return;const i=+v,gi=G.g.findIndex(g=>g.indexOf(i)>=0);if(gi>=0)G.g.splice(gi,1);else if(G.sel.indexOf(i)>=0)G.sel.splice(G.sel.indexOf(i),1);else G.sel.push(i);snd('click');render();},
  group:()=>{if(!canAct()||!G.sel.length)return;const t=selSum();if(t<5||t>10){toast('ผลรวม '+t+' ใช้ไม่ได้ — ต้องได้ 5 ถึง 10','warn');return;}G.g.push(G.sel.slice().sort((a,b)=>a-b));G.sel=[];snd('click');render();},
  ungroup:v=>{if(!canAct())return;G.g.splice(+v,1);render();},
  clear:()=>{if(!canAct())return;G.f=G.s.dice.slice();G.g=[];G.sel=[];G.wild=-1;render();},
  wild:v=>{if(!canAct())return;G.wild=(+v===G.wild)?-1:+v;render();},
  face:v=>{const i=G.wild;if(!canAct()||i<0||!canWild(i)||!allowFace(i,+v))return;G.f[i]=+v;const gi=G.g.findIndex(g=>g.indexOf(i)>=0);if(gi>=0)G.g.splice(gi,1);G.sel=G.sel.filter(x=>x!==i);G.wild=-1;snd('click');render();},
  sugg:()=>{if(!canAct())return;const seen={},out=[];try{AI.rank(G.s,'hard').forEach(o=>{const k=o.ms.join(',');if(!seen[k]&&out.length<3){seen[k]=1;out.push(o);}});}catch(e){}G.sugg=out;openModal({type:'sugg'});},
  pick:v=>{const o=G.sugg&&G.sugg[+v];G.modal=null;if(!o||!canAct()){render();return;}G.f=o.a.faces.slice();G.g=o.a.groups.map(x=>x.slice());G.sel=[];G.wild=-1;G.sugg=null;snd('click');render();},
  commit:()=>{if(!canAct()||G.s.phase!=='assign')return;if(G.sel.length){toast('ลูกเต๋าที่เลือกยังไม่ได้รวมเป็นกลุ่ม — กด “รวมกลุ่ม” หรือแตะเพื่อยกเลิก','warn');return;}
    const go=()=>{if(canAct()&&G.s.phase==='assign')act({type:'commit',faces:G.f.slice(),groups:G.g.map(x=>x.slice())},actor());};
    if(!G.g.length&&G.any)confirmM('ผ่านตาโดยไม่เดิน?','ยังมีกลุ่มลูกเต๋าที่เดินได้อยู่ ต้องการผ่านตานี้จริงหรือไม่','ผ่านตา',go);else go();},
  showEnd:()=>showEnd(),
  restart:()=>confirmM('เริ่มเกมใหม่?',G.mode==='host'?'เกมของทุกคนจะถูกแทนที่ด้วยเกมใหม่':'ความคืบหน้าของเกมนี้จะหายไป','เริ่มใหม่',()=>A.rematch()),
  rematch:()=>{G.modal=null;if(G.mode==='host'){const ps=G.s.players.map(p=>({name:p.name,color:p.color,kind:p.kind,diff:p.diff,seat:p.seat}));begin('host',ps,rnd(ps.length));hostBroadcast([]);toast('เริ่มเกมใหม่สำหรับทุกคนแล้ว','good');}
    else if(G.gameCfg){const ps=G.gameCfg.ps;begin(G.mode,ps,G.mode==='bots'&&G.gameCfg.first==='me'?0:rnd(ps.length));}},
  quit:()=>{if(!G.s||G.s.over){leaveGame();return;}confirmM('ออกไปเมนูหลัก?',isNet()?(G.mode==='host'?'ห้องจะถูกปิดและทุกคนจะถูกตัดการเชื่อมต่อ':'คุณจะออกจากห้องนี้'):(LS?'เกมถูกบันทึกไว้แล้ว เล่นต่อได้จากเมนูหลัก':'ความคืบหน้าจะหายไป'),'ออก',leaveGame);},
  hostCreate:()=>hostCreate(),invite:v=>invite(v),accept:v=>accept(v),setBot:v=>setBot(v),hostStart:()=>hostStart(),join:()=>join(),
  sdiff:v=>{const p=v.split(':'),st=NET.seats[+p[0]];if(st&&DIFF[p[1]]){st.diff=p[1];lobbyCast();render();}},
  closeRoom:()=>confirmM('ปิดห้อง?','ผู้เล่นทุกคนจะถูกตัดการเชื่อมต่อ','ปิดห้อง',()=>{teardown(true);render();}),
  leaveRoom:()=>{teardown(true);G.form.jerr='';render();},
  leaveOnline:()=>{if(NET.role)confirmM('ออกจากหน้าออนไลน์?','การเชื่อมต่อทั้งหมดจะถูกปิด','ออก',()=>{teardown(true);G.screen='menu';render();});else{G.screen='menu';render();}},
  copy:v=>{const t=document.getElementById(v);if(!t)return;const done=ok=>toast(ok?'คัดลอกแล้ว':'คัดลอกอัตโนมัติไม่ได้ — ข้อความถูกเลือกไว้แล้ว กดคัดลอกเอง',ok?'good':'warn');
    const fb=()=>{t.focus();t.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}done(ok);};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(()=>done(true),fb);else fb();}catch(e){fb();}},
  tests:()=>{G.testOut='กำลังทดสอบ… (การจำลองเกม 8 คนอาจใช้เวลาหลายวินาที)';render();setTimeout(()=>{const r=runTests(),f=r.filter(x=>!x[1]).length;
    G.testOut='<p class="'+(f?'bad':'ok')+'"><b>'+(f?'ไม่ผ่าน '+f+' จาก '+r.length:'ผ่านทั้งหมด '+r.length+' รายการ')+'</b></p>'+r.map(x=>'<div class="'+(x[1]?'ok':'bad')+'">'+(x[1]?'ผ่าน · ':'ไม่ผ่าน · ')+esc(x[0])+'</div>').join('');render();},50);},
  resetStats:()=>confirmM('ล้างสถิติ?','สถิติการเล่นทั้งหมดจะถูกลบ','ล้างสถิติ',()=>{STATS.played=0;STATS.wins=0;STATS.best=0;save('stats',STATS);toast('ล้างสถิติแล้ว','good');render();})
};
document.addEventListener('click',function(e){
  if(e.target&&e.target.id==='modal'&&G.modal&&G.modal.type!=='confirm'&&G.modal.type!=='hand'){closeModal();return;}
  const b=e.target&&e.target.closest?e.target.closest('[data-a]'):null;if(!b||b.disabled)return;const fn=A[b.getAttribute('data-a')];if(!fn)return;
  e.preventDefault();try{const r=fn(b.getAttribute('data-v'));if(r&&r.catch)r.catch(err=>{console.error(err);toast('เกิดข้อผิดพลาด: '+err.message,'err');});}catch(err){console.error(err);toast('เกิดข้อผิดพลาด: '+err.message,'err');}});
document.addEventListener('input',function(e){const k=e.target&&e.target.getAttribute&&e.target.getAttribute('data-k');if(k)G.form[k]=e.target.value;});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&G.modal){closeModal();return;}
  if(G.screen!=='game'||G.modal||!G.s||e.ctrlKey||e.metaKey||e.altKey)return;const t=e.target;if(t&&/INPUT|TEXTAREA|SELECT/.test(t.tagName))return;const k=(e.key||'').toLowerCase();
  if(k==='r')A.roll();else if(k.length===1&&'1234'.indexOf(k)>=0&&G.s.phase==='assign')A.die(String(+k-1));else if(k==='g')A.group();else if(k==='c')A.commit();});
window.addEventListener('beforeunload',function(){try{if(NET.role)teardown(true);}catch(e){}});

/* ===== START ===== */
try{applyCfg();render();BOOT.hidden=true;}catch(e){bootMsg('เริ่มเกมไม่สำเร็จ: '+e.message,true);}
})();
